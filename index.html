<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 성경읽기 다독 진도표</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --primary: #4a6fa5;
            --border-color: #dee2e6;
            /* 독수별 색상 단계 (많이 읽을수록 진해짐) */
            --level-1: #e8eef8;
            --level-2: #cbd9ef;
            --level-3: #9fbce3;
            --level-4: #6d96cc;
            --level-5: #4a6fa5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-top: 5px;
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        /* 통계 요약 영역 (바둑판 전체 현황) */
        .summary-container {
            background-color: #f1f3f5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            font-weight: bold;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* 콤팩트 바둑판 격자 레이아웃 */
        .bible-grid {
            display: grid;
            /* 가로 크기를 숫자까지 표현할 수 있도록 기존 70px에서 85px로 살짝 조정 */
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 6px;
            margin-bottom: 20px;
        }
        .bible-item {
            border: 1px solid var(--border-color);
            padding: 8px 2px;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s;
            background: #ffffff;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 마우스 우클릭 안내용 작은 팁 */
        .help-text {
            font-size: 11px;
            color: #868e96;
            text-align: right;
            margin-bottom: 5px;
        }

        /* 독수별 동적 배경색 설정 */
        .bible-item.count-1 { background-color: var(--level-1); color: #1e3a63; font-weight: 500; }
        .bible-item.count-2 { background-color: var(--level-2); color: #1a3358; font-weight: 500; }
        .bible-item.count-3 { background-color: var(--level-3); color: #ffffff; font-weight: bold; border-color: #8faed6; }
        .bible-item.count-4 { background-color: var(--level-4); color: #ffffff; font-weight: bold; border-color: #5b87c2; }
        .bible-item.count-5, 
        .bible-item.count-max { background-color: var(--level-5); color: #ffffff; font-weight: bold; border-color: var(--primary); }

        .reset-container {
            text-align: right;
            margin-top: 20px;
        }
        .reset-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📖 성경읽기 진도표 (다독용)</h1>
    
    <!-- 전체 누적 독수 확인 영역 -->
    <div class="summary-container" id="summaryText">
        현재 총 누적 읽기: 0독 분량 (완료된 책: 0 / 66권)
    </div>

    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('ot')">구약 성경 (39권)</button>
        <button class="tab-btn" onclick="switchTab('nt')">신약 성경 (27권)</button>
    </div>

    <div class="help-text">💡 좌클릭: +1독 / 우클릭(길게 누르기): -1독</div>
    <div id="bibleContent"></div>

    <div class="reset-container">
        <button class="reset-btn" onclick="resetStorage()">전체 초기화</button>
    </div>
</div>

<script>
    const otBooks = [
        "창", "출", "레", "민", "신", "수", "삿", "룻", "삼상", "삼하", 
        "왕상", "왕하", "대상", "대하", "스", "느", "에", "욥", "시", "잠", 
        "전", "아", "사", "렘", "애", "겔", "단", "호", "욜", "암", 
        "옵", "욘", "미", "나", "하", "습", "학", "스갸", "말"
    ];
    
    const ntBooks = [
        "마", "막", "누", "요", "행", "롬", "고전", "고후", "갈", "엡", 
        "빌", "골", "살전", "살후", "딤전", "딤후", "딛", "몬", "히", "야", 
        "벧전", "벧후", "요한1", "요한2", "요한3", "유", "계"
    ];


    let currentTab = 'ot';
    // 각 권당 숫자를 저장하기 위해 초기값을 빈 객체로 세팅 (숫자로 관리)
    let readCounts = JSON.parse(localStorage.getItem('bibleReadCounts')) || {};

    function render() {
        const contentDiv = document.getElementById('bibleContent');
        contentDiv.innerHTML = '';

        const books = currentTab === 'ot' ? otBooks : ntBooks;
        
        const grid = document.createElement('div');
        grid.className = 'bible-grid';

        books.forEach(book => {
            const count = readCounts[book] || 0;
            
            const item = document.createElement('div');
            item.className = 'bible-item';
            // 책 이름 옆에 숫자를 직관적으로 표시
            item.innerText = `${book} ${count}`;
            item.title = `${book} (${count}독 함)`;

            // 숫자에 따라 배경색 등급 클래스 부여
            if (count > 0) {
                if (count <= 5) {
                    item.classList.add(`count-${count}`);
                } else {
                    item.classList.add('count-max');
                }
            }

            // 좌클릭: 독수 증가
            item.onclick = (e) => {
                changeCount(book, 1);
            };

            // 우클릭: 독수 감소 (메뉴가 뜨는 기본 동작은 차단)
            item.oncontextmenu = (e) => {
                e.preventDefault();
                changeCount(book, -1);
            };

            grid.appendChild(item);
        });

        contentDiv.appendChild(grid);
        updateSummary();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', (idx === 0 && tab === 'ot') || (idx === 1 && tab === 'nt'));
        });
        render();
    }

    // 카운트 가감 계산 함수
    function changeCount(book, amount) {
        let currentCount = readCounts[book] || 0;
        currentCount += amount;

        if (currentCount < 0) currentCount = 0; // 음수 방지

        readCounts[book] = currentCount;
        localStorage.setItem('bibleReadCounts', JSON.stringify(readCounts));
        render();
    }

    // 전체 다독 통계 요약 업데이트
    function updateSummary() {
        const allBooks = [...otBooks, ...ntBooks];
        
        // 1번 이상 읽은 책의 개수
        const startedBooksCount = allBooks.filter(book => (readCounts[book] || 0) > 0).length;
        
        // 전체 성경구절 기준 총 누적 판수 계산 (소수점 첫째자리까지 표시)
        const totalChaptersRead = allBooks.reduce((acc, book) => acc + (readCounts[book] || 0), 0);
        const overallReads = (totalChaptersRead / 66).toFixed(1);

        document.getElementById('summaryText').innerText = 
            `현재 총 누적 읽기: 약 ${overallReads}독 분량 (한 번이라도 읽은 책: ${startedBooksCount} / 66권)`;
    }

    function resetStorage() {
        if (confirm('정말로 모든 읽기 기록과 누적 독수를 초기화하시겠습니까?')) {
            readCounts = {};
            localStorage.removeItem('bibleReadCounts');
            render();
        }
    }

    render();
</script>
</body>
</html>
