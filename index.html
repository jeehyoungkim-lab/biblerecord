<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 성경읽기 진도표</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --primary: #4a6fa5;
            --primary-light: #e8eef8;
            --border-color: #dee2e6;
            --group-bg: #f1f3f5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-top: 5px;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .progress-container {
            background-color: var(--border-color);
            border-radius: 8px;
            height: 20px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            left: 0;
            font-size: 12px;
            line-height: 20px;
            font-weight: bold;
            color: #000;
        }
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* 세부 분류 스타일 */
        .bible-group {
            background: var(--group-bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .group-title {
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
            border-left: 3px solid var(--primary);
            padding-left: 6px;
        }

        /* 그리드 및 가로 크기 슬림 조정 */
        .bible-grid {
            display: grid;
            /* 가로 최소 크기를 100px -> 70px로 대폭 줄여 한 줄에 더 많이 배치 */
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 6px;
        }
        .bible-item {
            border: 1px solid var(--border-color);
            padding: 6px 2px; /* 위아래, 좌우 여백을 줄여 콤팩트하게 변경 */
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s;
            background: #ffffff;
            font-size: 12px; /* 글자 크기를 약간 줄여 잘림 방지 */
            white-space: nowrap; /* 글자가 아래로 밀리지 않도록 고정 */
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bible-item.checked {
            background-color: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: bold;
        }
        .reset-container {
            text-align: right;
            margin-top: 20px;
        }
        .reset-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📖 성경읽기 진도표</h1>
    
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">0% (0 / 66권 완료)</div>
    </div>

    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('ot')">구약 성경</button>
        <button class="tab-btn" onclick="switchTab('nt')">신약 성경</button>
    </div>

    <div id="bibleContent"></div>

    <div class="reset-container">
        <button class="reset-btn" onclick="resetStorage()">전체 초기화</button>
    </div>
</div>

<script>
    // 구조화된 성경 데이터 (전통적 7대 분류 적용)
    const bibleData = {
        ot: [
            {
                title: "율법서 (모세오경)",
                books: ["창세기", "출애굽기", "레위기", "민수기", "신명기"]
            },
            {
                title: "역사서",
                books: ["여호수아", "사사기", "루기", "사무엘상", "사무엘하", "열왕기상", "열왕기하", "역대상", "역대하", "에스라", "느헤미야", "에스더"]
            },
            {
                title: "시가서",
                books: ["욥기", "시편", "잠언", "전도서", "아가"]
            },
            {
                title: "선지서 (대/소선지서)",
                books: ["이사야", "예레미야", "예레미야애가", "에스겔", "다니엘", "호세아", "요엘", "아모스", "오바댜", "요나", "미가", "나훔", "하박국", "스바냐", "학개", "스가랴", "말라기"]
            }
        ],
        nt: [
            {
                title: "복음서",
                books: ["마태복음", "마가복음", "누가복음", "요한복음"]
            },
            {
                title: "역사서",
                books: ["사도행전"]
            },
            {
                title: "서신서 (바울/일반서신)",
                books: ["로마서", "고린도전서", "고린도후서", "갈라디아서", "에베소서", "빌립보서", "골로새서", "데살로니가전서", "데살로니가후서", "디모데전서", "디모데후서", "디도서", "빌레몬서", "히브리서", "야고보서", "베드로전서", "베드로후서", "요한일서", "요한이서", "요한삼서", "유다서"]
            },
            {
                title: "예언서",
                books: ["요한계시록"]
            }
        ]
    };

    let currentTab = 'ot';
    let readStatus = JSON.parse(localStorage.getItem('bibleReadStatus')) || {};

    function render() {
        const contentDiv = document.getElementById('bibleContent');
        contentDiv.innerHTML = '';

        const groups = bibleData[currentTab];
        
        groups.forEach(group => {
            // 소분류 박스 생성
            const groupDiv = document.createElement('div');
            groupDiv.className = 'bible-group';

            // 소분류 제목 생성
            const titleDiv = document.createElement('div');
            titleDiv.className = 'group-title';
            titleDiv.innerText = group.title;
            groupDiv.appendChild(titleDiv);

            // 콤팩트 그리드 생성
            const grid = document.createElement('div');
            grid.className = 'bible-grid';

            group.books.forEach(book => {
                const item = document.createElement('div');
                item.className = 'bible-item';
                item.innerText = book;
                item.title = book; // 마우스 올리면 풀네임 툴팁 표시
                
                if (readStatus[book]) {
                    item.classList.add('checked');
                }

                item.onclick = () => toggleBook(book);
                grid.appendChild(item);
            });

            groupDiv.appendChild(grid);
            contentDiv.appendChild(groupDiv);
        });

        updateProgress();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', (idx === 0 && tab === 'ot') || (idx === 1 && tab === 'nt'));
        });
        render();
    }

    function toggleBook(book) {
        readStatus[book] = !readStatus[book];
        localStorage.setItem('bibleReadStatus', JSON.stringify(readStatus));
        render();
    }

    function updateProgress() {
        // 전체 66권 목록 통합 계산
        const allBooks = [...bibleData.ot, ...bibleData.nt].reduce((acc, curr) => acc.concat(curr.books), []);
        const totalBooks = allBooks.length;
        const readCount = allBooks.filter(book => readStatus[book]).length;
        const percent = Math.round((readCount / totalBooks) * 100);

        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressText').innerText = `${percent}% (${readCount} / ${totalBooks}권 완료)`;
    }

    function resetStorage() {
        if (confirm('정말로 모든 읽기 기록을 초기화하시겠습니까?')) {
            readStatus = {};
            localStorage.removeItem('bibleReadStatus');
            render();
        }
    }

    render();
</script>
</body>
</html>
